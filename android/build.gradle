plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pdfcompressor'
version = '0.1.0'

android {
  namespace "expo.modules.pdfcompressor"
  defaultConfig {
    // android.graphics.pdf.PdfRenderer requires API 21 (Android 5.0, 2014).
    minSdkVersion 21
    versionCode 1
    versionName "0.1.0"
  }
}
